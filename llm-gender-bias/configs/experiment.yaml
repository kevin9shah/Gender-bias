run_id: "review1"

models:
  - slot: octopus_family
    provider: octopus
    model_id: octopus-v1-debiased
    family: Octopus
    backbone_provider: gemini
    max_new_tokens: 300
  - slot: gpt_family
    provider: groq
    model_id: openai/gpt-oss-20b
    family: GPT
    api_key_env: GROQ_API_KEY
    max_new_tokens: 350
  - slot: google_family
    provider: gemini
    model_id: gemini-3.6-flash
    family: Google
    max_new_tokens: 700
  - slot: llama_family
    provider: ollama_or_groq
    ollama_id: llama3.2:3b
    fallback_model_id: llama-3.3-70b-versatile
    family: Llama
    api_key_env: GROQ_API_KEY
    max_new_tokens: 300
  - slot: qwen_family
    provider: groq
    model_id: qwen/qwen3.6-27b
    family: Qwen
    api_key_env: GROQ2_API_KEY
    extra_params:
      reasoning_effort: none
    max_new_tokens: 300

generation:
  max_new_tokens: 350
  temperature: 0.7
  seed: 42

data:
  scenarios_per_domain: 3
  prompt_variants: 8
  benchmarks:
    - crows_pairs
    - bbq
    - winobias

mitigation:
  top_k_scenarios: 6
  strategies: [fairness_instruction, counterfactual_self_check, selective_rewrite]

paths:
  scenarios: data/custom/scenarios.json
  raw_dir: results/raw
  metrics_dir: results/metrics
